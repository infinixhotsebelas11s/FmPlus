const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const getClubById = (id) => clubs.find((c) => c.id === id);
const getLeagueById = (id) => leagues.find((l) => l.id === id);
const getClubsByLeague = (lId) => clubs.filter((c) => c.leagueId === lId);

const getPlayerById = (id) => {
  const real = realPlayers.find((p) => p.id === id);
  if (real) return real;
  const match = id.match(/^(.+)_f(\d+)$/);
  if (match) {
    const club = getClubById(match[1]);
    if (club) {
      const idx = parseInt(match[2]);
      const baseOvr = club.transferBudget > 50 ? 78 : club.transferBudget > 10 ? 70 : 62;
      const positions = ['GK', 'CB', 'LB', 'RB', 'CDM', 'CM', 'CAM', 'LW', 'RW', 'ST'];
      const pos = positions[idx % positions.length];
      const ovr = clamp(baseOvr + ((idx * 7) % 12) - 6, 50, 88);
      return {
        id, name: `${club.name.split(' ')[0]} #${idx + 1}`,
        age: 20 + (idx % 14), position: pos, clubId: club.id,
        country: club.country, ovr, potential: ovr + ((idx * 3) % 6),
        marketValue: Math.max(0.1, Math.round((ovr - 50) * 0.5 * 10) / 10),
        wage: ovr > 80 ? 80000 : ovr > 70 ? 15000 : 2000,
      };
    }
  }
  return null;
};

const getPlayersByClub = (clubId) => {
  const real = realPlayers.filter((p) => p.clubId === clubId);
  if (real.length >= 14) return real;
  const club = getClubById(clubId);
  if (!club) return real;
  const needed = 14 - real.length;
  const fillers = [];
  for (let i = 0; i < needed; i++) {
    const f = getPlayerById(`${clubId}_f${i}`);
    if (f) fillers.push(f);
  }
  return [...real, ...fillers];
};

const fmtMoney = (n) => {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' M';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + ' Jt';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + ' rb';
  return String(Math.round(n));
};

const getCareerStage = (rep) => {
  let s = CAREER_STAGES[0];
  for (const c of CAREER_STAGES) if (rep >= c.minRep) s = c;
  return s;
};

const createNewGame = (name, clubId) => {
  const club = getClubById(clubId);
  const squad = getPlayersByClub(clubId).map((p) => p.id);
  return {
    manager: { name, reputation: 15, personalMoney: 50000 },
    club: { id: clubId, budget: Math.floor(club.transferBudget * 1000000), facilities: 2, academy: 2 },
    squad, formation: '4-3-3', mentality: 'Seimbang', style: 'Tiki-Taka',
    week: 1,
    season: { points: 0, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0 },
    history: [], lastMatch: null, notifications: [],
  };
};

const applyMatchResult = (state, result) => {
  const won = result.myGoals > result.oppGoals;
  const draw = result.myGoals === result.oppGoals;
  const repGain = won ? 3 : draw ? 1 : -1;
  const newRep = clamp(state.manager.reputation + repGain, 0, 100);
  const prize = won ? 500000 : draw ? 200000 : 50000;
  return {
    ...state,
    manager: { ...state.manager, reputation: newRep, personalMoney: state.manager.personalMoney + (won ? 3000 : draw ? 1500 : 800) },
    club: { ...state.club, budget: state.club.budget + prize },
    week: state.week + 1,
    season: {
      played: state.season.played + 1,
      wins: state.season.wins + (won ? 1 : 0),
      draws: state.season.draws + (draw ? 1 : 0),
      losses: state.season.losses + (!won && !draw ? 1 : 0),
      points: state.season.points + (won ? 3 : draw ? 1 : 0),
      gf: state.season.gf + result.myGoals,
      ga: state.season.ga + result.oppGoals,
    },
    lastMatch: { opponent: result.opponent.name, score: `${result.myGoals}-${result.oppGoals}`, won, draw },
    history: [...state.history, { week: state.week, opponent: result.opponent.name, score: `${result.myGoals}-${result.oppGoals}` }],
    notifications: [...state.notifications, `M${state.week}: ${result.myGoals}-${result.oppGoals} vs ${result.opponent.name}`].slice(-10),
  };
};

const simulateMatch = (state) => {
  const myClub = getClubById(state.club.id);
  const opponents = getClubsByLeague(myClub.leagueId).filter((c) => c.id !== myClub.id);
  const opponent = opponents.length > 0 ? pick(opponents) : myClub;
  const mySquad = state.squad.map(getPlayerById).filter(Boolean);
  const oppSquad = getPlayersByClub(opponent.id);
  const rating = (sq) => (sq.length ? sq.reduce((s, p) => s + p.ovr, 0) / sq.length : 65);
  const myRating = rating(mySquad);
  const oppRating = rating(oppSquad);
  const myPower = myRating + 3 + rand(-4, 4);
  const oppPower = oppRating + rand(-4, 4);
  const events = [{ minute: 0, text: `⚽ Kick-off! ${myClub.name} vs ${opponent.name} di ${myClub.stadium}.`, type: 'info' }];
  const attackers = mySquad.filter((p) => ['ST', 'CF', 'LW', 'RW', 'CAM', 'CM'].includes(p.position));
  const oppAttackers = oppSquad.filter((p) => ['ST', 'CF', 'LW', 'RW', 'CAM', 'CM'].includes(p.position));
  let myGoals = 0, oppGoals = 0;
  for (let m = 1; m <= 90; m++) {
    if (Math.random() < 0.08 * (myPower / (oppPower + 20))) {
      if (Math.random() < 0.3 + (myRating - oppRating) / 100) {
        const scorer = attackers.length ? pick(attackers) : { name: 'Pemain' };
        myGoals++;
        events.push({ minute: m, text: `⚽ GOAL! ${scorer.name} mencetak gol untuk ${myClub.name}! Skor ${myGoals}-${oppGoals}`, type: 'goal' });
      } else {
        events.push({ minute: m, text: `🎯 Peluang ${myClub.name} digagalkan!`, type: 'chance' });
      }
    }
    if (Math.random() < 0.08 * (oppPower / (myPower + 20))) {
      if (Math.random() < 0.3 + (oppRating - myRating) / 100) {
        const scorer = oppAttackers.length ? pick(oppAttackers) : { name: 'Pemain' };
        oppGoals++;
        events.push({ minute: m, text: `⚽ GOAL! ${scorer.name} mencetak gol untuk ${opponent.name}. Skor ${myGoals}-${oppGoals}`, type: 'goal-opp' });
      }
    }
  }
  events.push({ minute: 90, text: `⏱️ Full-time! ${myClub.name} ${myGoals}-${oppGoals} ${opponent.name}`, type: 'final' });
  return { opponent, myGoals, oppGoals, events };
};

function Dashboard({ state, setState, setTab, setMatchLog, setMatchPlaying, matchPlaying }) {
  const club = getClubById(state.club.id);
  const league = getLeagueById(club.leagueId);
  const nextOpponent = useMemo(() => {
    const opps = getClubsByLeague(club.leagueId).filter((c) => c.id !== club.id);
    return opps.length ? pick(opps) : club;
  }, [club]);

  const handlePlay = async () => {
    if (matchPlaying) return;
    setMatchPlaying(true);
    setMatchLog([]);
    const result = simulateMatch(state);
    for (const ev of result.events) {
      await new Promise((r) => setTimeout(r, 180));
      setMatchLog((prev) => [...prev, ev]);
    }
    setState((prev) => applyMatchResult(prev, result));
    setMatchPlaying(false);
  };

  return (
    <div className="space-y-4">
      <div className="panel p-4">
        <h2 className="text-xl font-bold gold-text mb-1">{club.name}</h2>
        <p className="text-sm text-gray-400">{league.name} · {club.country}</p>
        <p className="text-xs text-gray-500 mt-1">🏟️ {club.stadium} ({club.capacity.toLocaleString()} kursi)</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3 text-sm">
          <Stat label="Minggu" value={state.week} />
          <Stat label="Poin" value={state.season.points} />
          <Stat label="Main" value={state.season.played} />
          <Stat label="Selisih Gol" value={`${state.season.gf - state.season.ga >= 0 ? '+' : ''}${state.season.gf - state.season.ga}`} />
        </div>
      </div>
      <div className="panel p-4">
        <h3 className="text-lg font-bold text-yellow-400 mb-2">⚔️ Pertandingan Berikutnya</h3>
        <p className="mb-3 text-gray-300">{club.name} vs <span className="gold-text font-bold">{nextOpponent.name}</span></p>
        <button onClick={handlePlay} disabled={matchPlaying}
          className="w-full py-3 bg-neon text-black font-bold rounded hover:brightness-110 disabled:opacity-50">
          {matchPlaying ? '⏳ PERTANDINGAN BERLANGSUNG...' : '▶️ MAIN PERTANDINGAN'}
        </button>
      </div>
      {state.lastMatch && (
        <div className="panel p-4">
          <h3 className="text-sm font-bold text-gray-400 mb-1">Hasil Terakhir</h3>
          <p className={`text-lg font-bold ${state.lastMatch.won ? 'text-green-400' : state.lastMatch.draw ? 'text-yellow-400' : 'text-red-400'}`}>
            {state.lastMatch.score} vs {state.lastMatch.opponent}

        </div>
      )}

        <div className="panel p-4">
          <h3 className="text-sm font-bold text-gray-400 mb-2">Riwayat</h3>

              </div>
            ))}

        </div>
      )}

  );

    setState((prev) => ({

      <SelectField label="Mentalitas" value={state.mentality} options={MENTALITIES} onChange={(v) => setState({ ...state, mentality: v })} />
      <SelectField label="Gaya Main" value={state.style} options={STYLES} onChange={(v) => setState({ ...state, style: v })} />
      <div className="panel p-4 text-sm text-gray-400 space-y-1">
        <p>📋 Formasi mempengaruhi keseimbangan serangan & pertahanan.</p>
        <p>💪 Mentalitas mempengaruhi agresivitas tim.</p>
        <p>🎯 Gaya main memberi bonus spesifik.</p>
      </div>
    </div>
  );
}

function SelectField({ label, value, options, onChange }) {
  return (
    <div className="panel p-4">
      <label className="block text-sm mb-2 text-gold">{label}</label>
      <select value={value} onChange={(e) => onChange(e.target.value)} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded">
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}

function Transfer({ state, setState }) {
  const [search, setSearch] = useState('');
  const [posFilter, setPosFilter] = useState('');
  const available = useMemo(() => {
    return allPlayers
      .filter((p) => !state.squad.includes(p.id))
      .filter((p) => !search || p.name.toLowerCase().includes(search.toLowerCase()))
      .filter((p) => !posFilter || p.position === posFilter)
      .sort((a, b) => b.ovr - a.ovr)
      .slice(0, 60);
  }, [search, posFilter, state.squad]);

  const buyPlayer = (p) => {
    const basePrice = p.marketValue * 1000000;
    if (basePrice > state.club.budget) return window.alert('❌ Budget klub tidak cukup!');
    const finalPrice = Math.round(basePrice * (1 + Math.random() * 0.3));
    if (finalPrice > state.club.budget) return window.alert(`❌ Nego gagal — harga final €${fmtMoney(finalPrice)} melebihi budget.`);
    if (!window.confirm(`Beli ${p.name} seharga €${fmtMoney(finalPrice)}?`)) return;
    setState((prev) => ({
      ...prev,
      club: { ...prev.club, budget: prev.club.budget - finalPrice },
      squad: [...prev.squad, p.id],
      notifications: [...prev.notifications, `✅ ${p.name} bergabung`].slice(-10),
    }));
  };

  return (
    <div className="space-y-3">
      <div className="panel p-3">
        <div className="text-sm text-gray-400 mb-2">Budget: <span className="text-green-400 font-bold">€{fmtMoney(state.club.budget)}</span></div>
        <input placeholder="🔍 Cari nama pemain..." value={search} onChange={(e) => setSearch(e.target.value)}
          className="w-full px-3 py-2 mb-2 bg-zinc-900 border border-zinc-700 rounded" />
        <select value={posFilter} onChange={(e) => setPosFilter(e.target.value)} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded">
          <option value="">Semua Posisi</option>
          {['GK', 'CB', 'LB', 'RB', 'CDM', 'CM', 'CAM', 'LW', 'RW', 'ST', 'CF'].map((p) => <option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      {available.length === 0 && <div className="text-center text-gray-500 py-6">Tidak ada pemain ditemukan.</div>}
      <div className="space-y-2">
        {available.map((p) => {
          const price = p.marketValue * 1000000;
          const clubFrom = getClubById(p.clubId);
          return (
            <div key={p.id} className="panel p-3 flex justify-between items-center">
              <div className="flex-1">
                <div className="font-bold text-sm">{p.name}</div>
                <div className="text-xs text-gray-400">{p.position} · {p.age} thn · {clubFrom?.name || p.country}</div>
              </div>
              <div className="text-right mr-3">
                <div className="text-lg font-bold gold-text">{p.ovr}</div>
                <div className="text-xs text-gray-500">€{fmtMoney(price)}</div>
              </div>
              <button onClick={() => buyPlayer(p)} disabled={price > state.club.budget}
                className="text-xs bg-green-600 hover:bg-green-500 disabled:bg-zinc-700 disabled:text-gray-500 px-2 py-1 rounded">BELI</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Training({ state, setState }) {
  const facCost = () => 500000 * state.club.facilities;
  const acaCost = () => 400000 * state.club.academy;
  const upgradeFacility = () => {
    if (state.club.facilities >= 5) return window.alert('Sudah level maksimal!');
    const cost = facCost();
    if (cost > state.club.budget) return window.alert('Budget tidak cukup!');
    setState({ ...state, club: { ...state.club, facilities: state.club.facilities + 1, budget: state.club.budget - cost } });
  };
  const upgradeAcademy = () => {
    if (state.club.academy >= 5) return window.alert('Akademi sudah maksimal!');
    const cost = acaCost();
    if (cost > state.club.budget) return window.alert('Budget tidak cukup!');
    setState({ ...state, club: { ...state.club, academy: state.club.academy + 1, budget: state.club.budget - cost } });
  };
  const trainSquad = () => {
    const cost = 200000;
    if (cost > state.club.budget) return window.alert('Budget tidak cukup!');
    setState((prev) => ({ ...prev, club: { ...prev.club, budget: prev.club.budget - cost } }));
    window.alert('✅ Sesi latihan berhasil! Semua pemain mendapat pengalaman.');
  };
  return (
    <div className="space-y-3">
      <div className="panel p-4 flex justify-between items-center">
        <div>
          <div className="font-bold text-gold">🏗️ Fasilitas Latihan</div>
          <div className="text-xs text-gray-400">Level {state.club.facilities} / 5</div>
        </div>
        <button onClick={upgradeFacility} className="bg-yellow-500 text-black px-3 py-1 rounded text-sm font-bold">Upgrade (€{fmtMoney(facCost())})</button>
      </div>
      <div className="panel p-4 flex justify-between items-center">
        <div>
          <div className="font-bold text-gold">🎓 Akademi Muda</div>
          <div className="text-xs text-gray-400">Level {state.club.academy} / 5</div>
        </div>
        <button onClick={upgradeAcademy} className="bg-yellow-500 text-black px-3 py-1 rounded text-sm font-bold">Upgrade (€{fmtMoney(acaCost())})</button>
      </div>
      <div className="panel p-4 flex justify-between items-center">
        <div>
          <div className="font-bold text-gold">🏋️ Sesi Latihan Intensif</div>
          <div className="text-xs text-gray-400">Tingkatkan performa</div>
        </div>
        <button onClick={trainSquad} className="bg-green-600 px-3 py-1 rounded text-sm font-bold">Latih (€200 rb)</button>
      </div>
    </div>
  );
}

function DatabaseView() {
  const [query, setQuery] = useState('');
  const [leagueFilter, setLeagueFilter] = useState('');
  const results = useMemo(() => {
    return allPlayers
      .filter((p) => !query || p.name.toLowerCase().includes(query.toLowerCase()))
      .filter((p) => {
        if (!leagueFilter) return true;
        const club = getClubById(p.clubId);
        return club?.leagueId === leagueFilter;
      })
      .sort((a, b) => b.ovr - a.ovr)
      .slice(0, 100);
  }, [query, leagueFilter]);
  return (
    <div className="space-y-3">
      <div className="panel p-3">
        <input placeholder="🔍 Cari nama pemain asli..." value={query} onChange={(e) => setQuery(e.target.value)}
          className="w-full px-3 py-2 mb-2 bg-zinc-900 border border-zinc-700 rounded" />
        <select value={leagueFilter} onChange={(e) => setLeagueFilter(e.target.value)} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded">
          <option value="">Semua Liga</option>
          {leagues.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
      </div>
      <div className="text-xs text-gray-500 text-center">{results.length} pemain ditemukan</div>
      <div className="space-y-1">
        {results.map((p) => {
          const club = getClubById(p.clubId);
          return (
            <div key={p.id} className="panel p-2 flex justify-between items-center text-sm">
              <div>
                <div className="font-bold">{p.name}</div>
                <div className="text-xs text-gray-400">{p.position} · {club?.name || p.country}</div>
              </div>
              <div className="text-right">
                <div className="gold-text font-bold">{p.ovr}</div>
                <div className="text-xs text-gray-500">€{fmtMoney(p.marketValue * 1000000)}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CareerView({ state, setState }) {
  const currentStage = getCareerStage(state.manager.reputation);
  const currentIdx = CAREER_STAGES.findIndex((s) => s.id === currentStage.id);
  const nextStage = CAREER_STAGES[currentIdx + 1];
  return (
    <div className="space-y-3">
      <div className="panel p-4">
        <div className="text-sm text-gray-400">Jabatan Saat Ini</div>
        <div className="text-2xl font-bold gold-text">{currentStage.name}</div>
        <div className="text-xs text-gray-500 mt-1">Gaji: €{fmtMoney(currentStage.salary)}/minggu</div>
        <div className="text-sm text-green-400 mt-2">Reputasi: {state.manager.reputation} / 100</div>
        <div className="w-full bg-zinc-800 rounded h-2 mt-1 overflow-hidden">
          <div className="bg-green-500 h-full" style={{ width: `${state.manager.reputation}%` }} />
        </div>
      </div>
      {nextStage && (
        <div className="panel p-4">
          <div className="text-sm text-gray-400">Jabatan Berikutnya</div>
          <div className="text-lg font-bold text-yellow-400">{nextStage.name}</div>
          <div className="text-xs text-gray-500">Butuh reputasi {nextStage.minRep} untuk promosi</div>
        </div>
      )}
      <div className="panel p-4">
        <h3 className="text-sm font-bold text-gray-400 mb-2">Jalur Karier</h3>
        {CAREER_STAGES.map((s, i) => (
          <div key={s.id} className={`flex items-center gap-2 py-1 ${i <= currentIdx ? 'text-green-400' : 'text-gray-500'}`}>
            <span>{i <= currentIdx ? '✅' : '⬜'}</span>
            <span className="text-sm">{s.name}</span>
            <span className="text-xs ml-auto">Rep {s.minRep}+</span>
          </div>
        ))}
      </div>
      {state.manager.reputation >= 94 && (
        <div className="panel p-4 bg-gradient-to-r from-yellow-900/40 to-transparent">
          <h3 className="text-lg font-bold gold-text mb-2">👑 LEVEL OWNER TERCAPAI</h3>
          <p className="text-sm text-gray-300">Sebagai Owner, kamu bisa membeli klub lain.</p>
          <button onClick={() => window.alert('Fitur akuisisi klub akan tersedia di update berikutnya!')}
            className="mt-2 bg-yellow-500 text-black px-3 py-1 rounded text-sm font-bold">🏟️ Beli Klub Lain</button>
        </div>
      )}
    </div>
  );
}

function MatchOverlay({ log, playing, state, onClose }) {
  const club = getClubById(state.club.id);
  return (
    <div className="max-w-3xl mx-auto">
      <div className="panel p-4 text-center mb-3">
        <div className="text-lg font-bold gold-text">{club.name}</div>
        <div className="text-xs text-gray-400 mt-1">{playing ? '⏳ PERTANDINGAN BERLANGSUNG' : '✅ PERTANDINGAN SELESAI'}</div>
      </div>
      <div className="panel p-3 min-h-[300px] max-h-[60vh] overflow-y-auto space-y-1">
        {log.map((ev, i) => (
          <div key={i} className={`text-sm p-2 rounded ${
            ev.type === 'goal' ? 'bg-green-900/50 text-green-300 font-bold' :
            ev.type === 'goal-opp' ? 'bg-red-900/50 text-red-300 font-bold' :
            ev.type === 'final' ? 'bg-yellow-900/40 text-yellow-300 font-bold text-center' :
            ev.type === 'chance' ? 'text-yellow-200/80' :
            'text-gray-300'
          }`}>
            {ev.minute > 0 && <span className="text-gray-500 font-mono mr-2">[{ev.minute}']</span>}
            {ev.text}
          </div>
        ))}
      </div>
      {!playing && log.length > 0 && (
        <button onClick={onClose} className="w-full mt-3 py-3 bg-yellow-500 text-black font-bold rounded hover:bg-yellow-400">
          KEMBALI KE DASHBOARD
        </button>
      )}
    </div>
  );
}

// Mount
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
