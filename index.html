const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const getClubById = (id) => clubs.find((c) => c.id === id);
const getLeagueById = (id) => leagues.find((l) => l.id === id);
const getClubsByLeague = (lId) => clubs.filter((c) => c.leagueId === lId);

const getPlayerById = (id) => {
  const real = realPlayers.find((p) => p.id === id);
  if (real) return real;
  const match = id.match(/^(.+)_f(\d+)$/);
  if (match) {
    const club = getClubById(match[1]);
    if (club) {
      const idx = parseInt(match[2]);
      const baseOvr = club.transferBudget > 50 ? 78 : club.transferBudget > 10 ? 70 : 62;
      const positions = ['GK', 'CB', 'LB', 'RB', 'CDM', 'CM', 'CAM', 'LW', 'RW', 'ST'];
      const pos = positions[idx % positions.length];
      const ovr = clamp(baseOvr + ((idx * 7) % 12) - 6, 50, 88);
      return {
        id, name: `${club.name.split(' ')[0]} #${idx + 1}`, age: 20 + (idx % 14), position: pos, clubId: club.id,
        country: club.country, ovr, potential: ovr + ((idx * 3) % 6),
        marketValue: Math.max(0.1, Math.round((ovr - 50) * 0.5 * 10) / 10),
        wage: ovr > 80 ? 80000 : ovr > 70 ? 15000 : 2000,
      };
    }
  }
  return null;
};

const getPlayersByClub = (clubId) => {
  const real = realPlayers.filter((p) => p.clubId === clubId);
  if (real.length >= 14) return real;
  const club = getClubById(clubId);
  if (!club) return real;
  const needed = 14 - real.length;
  const fillers = [];
  for (let i = 0; i < needed; i++) {
    const f = getPlayerById(`${clubId}_f${i}`);
    if (f) fillers.push(f);
  }
  return [...real, ...fillers];
};

const allPlayers = [];
clubs.forEach((c) => { allPlayers.push(...getPlayersByClub(c.id)); });

const CAREER_STAGES = [
  { id: 'asisten', name: 'Asisten Pelatih', minRep: 0, salary: 3000 },
  { id: 'manajer', name: 'Manajer', minRep: 25, salary: 15000 },
  { id: 'dirtek', name: 'Direktur Teknik', minRep: 45, salary: 40000 },
  { id: 'diror', name: 'Direktur Olahraga', minRep: 62, salary: 80000 },
  { id: 'ceo', name: 'CEO', minRep: 78, salary: 180000 },
  { id: 'presiden', name: 'Presiden Klub', minRep: 88, salary: 400000 },
  { id: 'owner', name: 'Owner', minRep: 94, salary: 1000000 },
];

const FORMATIONS = ['4-3-3', '4-4-2', '3-5-2', '4-2-3-1', '5-3-2'];
const STYLES = ['Tiki-Taka', 'Counter Attack', 'Gegenpressing', 'Parkir Bus', 'Long Ball'];
const MENTALITIES = ['Defensif', 'Seimbang', 'Menyerang', 'Ultra Menyerang'];
const TAB_LIST = ['dashboard', 'squad', 'tactics', 'transfer', 'training', 'database', 'career'];

const fmtMoney = (n) => {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' M';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + ' Jt';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + ' rb';
  return String(Math.round(n));
};

const getCareerStage = (rep) => {
  let s = CAREER_STAGES[0];
  for (const c of CAREER_STAGES) if (rep >= c.minRep) s = c;
  return s;
};

const createNewGame = (name, clubId) => {
  const club = getClubById(clubId);
  const squad = getPlayersByClub(clubId).map((p) => p.id);
  return {
    manager: { name, reputation: 15, personalMoney: 50000 },
    club: { id: clubId, budget: Math.floor(club.transferBudget * 1000000), facilities: 2, academy: 2 },
    squad, formation: '4-3-3', mentality: 'Seimbang', style: 'Tiki-Taka',
    week: 1, season: { points: 0, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0 },
    history: [], lastMatch: null, notifications: [],
  };
};

const applyMatchResult = (state, result) => {
  const won = result.myGoals > result.oppGoals;
  const draw = result.myGoals === result.oppGoals;
  const repGain = won ? 3 : draw ? 1 : -1;
  const newRep = clamp(state.manager.reputation + repGain, 0, 100);
  const prize = won ? 500000 : draw ? 200000 : 50000;
  return {
    ...state,
    manager: { ...state.manager, reputation: newRep, personalMoney: state.manager.personalMoney + (won ? 3000 : draw ? 1500 : 800) },
    club: { ...state.club, budget: state.club.budget + prize },
    week: state.week + 1,
    season: { played: state.season.played + 1, wins: state.season.wins + (won ? 1 : 0), draws: state.season.draws + (draw ? 1 : 0), losses: state.season.losses + (!won && !draw ? 1 : 0), points: state.season.points + (won ? 3 : draw ? 1 : 0), gf: state.season.gf + result.myGoals, ga: state.season.ga + result.oppGoals },
    lastMatch: { opponent: result.opponent.name, score: `${result.myGoals}-${result.oppGoals}`, won, draw },
    history: [...state.history, { week: state.week, opponent: result.opponent.name, score: `${result.myGoals}-${result.oppGoals}` }],
  };
};

const simulateMatch = (state) => {
  const myClub = getClubById(state.club.id);
  const opponents = getClubsByLeague(myClub.leagueId).filter((c) => c.id !== myClub.id);
  const opponent = opponents.length > 0 ? pick(opponents) : myClub;
  const mySquad = state.squad.map(getPlayerById).filter(Boolean);
  const oppSquad = getPlayersByClub(opponent.id);
  const rating = (sq) => (sq.length ? sq.reduce((s, p) => s + p.ovr, 0) / sq.length : 65);
  const myRating = rating(mySquad);
  const oppRating = rating(oppSquad);
  const myPower = myRating + 3 + rand(-4, 4);
  const oppPower = oppRating + rand(-4, 4);
  const events = [{ minute: 0, text: `⚽ Kick-off! ${myClub.name} vs ${opponent.name} di ${myClub.stadium}.`, type: 'info' }];
  const attackers = mySquad.filter((p) => ['ST', 'CF', 'LW', 'RW', 'CAM', 'CM'].includes(p.position));
  const oppAttackers = oppSquad.filter((p) => ['ST', 'CF', 'LW', 'RW', 'CAM', 'CM'].includes(p.position));
  let myGoals = 0, oppGoals = 0;
  for (let m = 1; m <= 90; m++) {
    if (Math.random() < 0.08 * (myPower / (oppPower + 20))) {
      if (Math.random() < 0.3 + (myRating - oppRating) / 100) {
        const scorer = attackers.length ? pick(attackers) : { name: 'Pemain' };
        myGoals++;
        events.push({ minute: m, text: `⚽ GOAL! ${scorer.name} mencetak gol untuk ${myClub.name}! Skor ${myGoals}-${oppGoals}`, type: 'goal' });
      } else {
        events.push({ minute: m, text: `🎯 Peluang ${myClub.name} digagalkan!`, type: 'chance' });
      }
    }
    if (Math.random() < 0.08 * (oppPower / (myPower + 20))) {
      if (Math.random() < 0.3 + (oppRating - myRating) / 100) {
        const scorer = oppAttackers.length ? pick(oppAttackers) : { name: 'Pemain' };
        oppGoals++;
        events.push({ minute: m, text: `⚽ GOAL! ${scorer.name} mencetak gol untuk ${opponent.name}. Skor ${myGoals}-${oppGoals}`, type: 'goal-opp' });
      }
    }
  }
  events.push({ minute: 90, text: `⏱️ Full-time! ${myClub.name} ${myGoals}-${oppGoals} ${opponent.name}`, type: 'final' });
  return { opponent, myGoals, oppGoals, events };
};

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState('dashboard');
  const [matchLog, setMatchLog] = useState([]);
  const [matchPlaying, setMatchPlaying] = useState(false);

  useEffect(() => {
    try {
      const saved = localStorage.getItem('fm_save_v1');
      if (saved) setState(JSON.parse(saved));
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (state) localStorage.setItem('fm_save_v1', JSON.stringify(state));
  }, [state]);

  const resetGame = () => {
    if (window.confirm('Reset permainan?')) {
      localStorage.removeItem('fm_save_v1');
      setState(null);
      setTab('dashboard');
      setMatchLog([]);
    }
  };

  if (!state) return <StartScreen onStart={(name, clubId) => setState(createNewGame(name, clubId))} />;

  return (
    <div className="min-h-screen bg-black text-white">
      <HUD state={state} onReset={resetGame} />
      <nav className="flex overflow-x-auto gap-1 p-2 bg-zinc-900 border-b border-yellow-500/20 sticky top-0 z-10">
        {TAB_LIST.map((t) => (
          <button key={t} onClick={() => setTab(t)}
            className={`btn px-3 py-2 text-xs md:text-sm rounded whitespace-nowrap ${tab === t ? 'bg-yellow-500 text-black font-bold' : 'bg-zinc-800 text-gray-300 hover:bg-zinc-700'}`}>
            {t.toUpperCase()}
          </button>
        ))}
      </nav>
      <main className="p-3 md:p-6 max-w-6xl mx-auto">
        {tab === 'dashboard' && <Dashboard state={state} setState={setState} setTab={setTab} setMatchLog={setMatchLog} setMatchPlaying={setMatchPlaying} matchPlaying={matchPlaying} />}
        {tab === 'squad' && <Squad state={state} setState={setState} />}
        {tab === 'tactics' && <Tactics state={state} setState={setState} />}
        {tab === 'transfer' && <Transfer state={state} setState={setState} />}
        {tab === 'training' && <Training state={state} setState={setState} />}
        {tab === 'database' && <DatabaseView />}
        {tab === 'career' && <CareerView state={state} setState={setState} />}
      </main>
      {matchLog.length > 0 && (
        <div className="fixed inset-0 bg-black/90 z-50 p-3 overflow-y-auto">
          <MatchOverlay log={matchLog} playing={matchPlaying} state={state} onClose={() => { setMatchLog([]); setTab('dashboard'); }} />
        </div>
      )}
    </div>
  );
}

function StartScreen({ onStart }) {
  const [name, setName] = useState('Komandan');
  const [leagueId, setLeagueId] = useState('eng_prem');
  const [clubId, setClubId] = useState('mci');
  const clubsInLeague = getClubsByLeague(leagueId);

  useEffect(() => {
    if (clubsInLeague.length > 0 && !clubsInLeague.find((c) => c.id === clubId)) {
      setClubId(clubsInLeague[0].id);
    }
  }, [leagueId, clubId]);

  return (
    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-black via-zinc-950 to-black">
      <div className="panel p-6 w-full max-w-lg">
        <h1 className="text-2xl md:text-3xl font-bold gold-text text-center mb-1">⚽ FOOTBALL MANAGER</h1>
        <p className="text-center text-xs text-gray-400 mb-6">From Manager to Owner</p>
        <label className="block text-sm mb-1 text-gold">Nama Manajer</label>
        <input value={name} onChange={(e) => setName(e.target.value)} className="w-full mb-4 px-3 py-2 bg-zinc-900 border border-zinc-700 rounded focus:outline-none" />
        <label className="block text-sm mb-1 text-gold">Liga</label>
        <select value={leagueId} onChange={(e) => setLeagueId(e.target.value)} className="w-full mb-4 px-3 py-2 bg-zinc-900 border border-zinc-700 rounded">
          {leagues.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <label className="block text-sm mb-1 text-gold">Klub</label>
        <select value={clubId} onChange={(e) => setClubId(e.target.value)} className="w-full mb-6 px-3 py-2 bg-zinc-900 border border-zinc-700 rounded">
          {clubsInLeague.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <button onClick={() => onStart(name, clubId)} className="w-full py-3 bg-yellow-500 text-black font-bold rounded">🚀 MULAI KARIR</button>
      </div>
    </div>
  );
}

function HUD({ state, onReset }) {
  const stage = getCareerStage(state.manager.reputation);
  return (
    <header className="bg-zinc-900 border-b border-yellow-500/30 px-3 py-3 flex flex-wrap gap-3 items-center justify-between">
      <div className="flex items-center gap-3 flex-wrap text-xs">
        <span className="px-2 py-1 rounded bg-yellow-500 text-black font-bold">{stage.name.toUpperCase()}</span>
        <span className="neon-text">★ REP: {state.manager.reputation}</span>
        <span className="gold-text">💰 €{fmtMoney(state.manager.personalMoney)}</span>
        <span className="text-green-400">🏦 €{fmtMoney(state.club.budget)}</span>
      </div>
      <button onClick={onReset} className="text-xs text-red-400 border border-red-500/40 rounded px-2 py-1">RESET</button>
    </header>
  );
}

function Dashboard({ state, setState, setTab, setMatchLog, setMatchPlaying, matchPlaying }) {
  const club = getClubById(state.club.id);
  const league = getLeagueById(club.leagueId);
  const handlePlay = async () => {
    if (matchPlaying) return;
    setMatchPlaying(true);
    setMatchLog([]);
    const result = simulateMatch(state);
    for (const ev of result.events) {
      await new Promise((r) => setTimeout(r, 180));
      setMatchLog((prev) => [...prev, ev]);
    }
    setState((prev) => applyMatchResult(prev, result));
    setMatchPlaying(false);
  };
  return (
    <div className="space-y-4">
      <div className="panel p-4">
        <h2 className="text-xl font-bold gold-text mb-1">{club.name}</h2>
        <p className="text-sm text-gray-400">{league.name} · {club.country}</p>
        <div className="grid grid-cols-4 gap-2 mt-3 text-sm">
          <div className="bg-zinc-900 p-2 text-center rounded"><div className="text-xs text-gray-500">Minggu</div><div className="text-lg font-bold gold-text">{state.week}</div></div>
          <div className="bg-zinc-900 p-2 text-center rounded"><div className="text-xs text-gray-500">Poin</div><div className="text-lg font-bold gold-text">{state.season.points}</div></div>
          <div className="bg-zinc-900 p-2 text-center rounded"><div className="text-xs text-gray-500">Main</div><div className="text-lg font-bold gold-text">{state.season.played}</div></div>
          <div className="bg-zinc-900 p-2 text-center rounded"><div className="text-xs text-gray-500">SG</div><div className="text-lg font-bold gold-text">{state.season.gf - state.season.ga}</div></div>
        </div>
      </div>
      <div className="panel p-4">
        <h3 className="text-lg font-bold text-yellow-400 mb-2">⚔️ Pertandingan</h3>
        <button onClick={handlePlay} disabled={matchPlaying} className="w-full py-3 bg-neon text-black font-bold rounded disabled:opacity-50">
          {matchPlaying ? '⏳ BERLANGSUNG...' : '▶️ MAIN PERTANDINGAN'}
        </button>
      </div>
      {state.lastMatch && (
        <div className="panel p-4">
          <h3 className="text-sm font-bold text-gray-400 mb-1">Hasil Terakhir</h3>
          <p className={`text-lg font-bold ${state.lastMatch.won ? 'text-green-400' : state.lastMatch.draw ? 'text-yellow-400' : 'text-red-400'}`}>
            {state.lastMatch.score} vs {state.lastMatch.opponent}
          </p>
        </div>
      )}
    </div>
  );
}

function Squad({ state, setState }) {
  const squadPlayers = state.squad.map(getPlayerById).filter(Boolean);
  return (
    <div className="space-y-2">
      {squadPlayers.sort((a, b) => b.ovr - a.ovr).map((p) => (
        <div key={p.id} className="panel p-3 flex justify-between items-center">
          <div><div className="font-bold">{p.name}</div><div className="text-xs text-gray-400">{p.position} · {p.age} thn · {p.country}</div></div>
          <div className="text-right"><div className="text-lg font-bold gold-text">{p.ovr}</div><div className="text-xs text-gray-500">€{fmtMoney(p.marketValue * 1000000)}</div></div>
        </div>
      ))}
    </div>
  );
}

function Tactics({ state, setState }) {
  const SelectField = ({ label, value, options, onChange }) => (
    <div className="panel p-4">
      <label className="block text-sm mb-2 text-gold">{label}</label>
      <select value={value} onChange={(e) => onChange(e.target.value)} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded">
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
  return (
    <div className="space-y-4">
      <SelectField label="Formasi" value={state.formation} options={FORMATIONS} onChange={(v) => setState({ ...state, formation: v })} />
      <SelectField label="Mentalitas" value={state.mentality} options={MENTALITIES} onChange={(v) => setState({ ...state, mentality: v })} />
      <SelectField label="Gaya Main" value={state.style} options={STYLES} onChange={(v) => setState({ ...state, style: v })} />
    </div>
  );
}

function Transfer({ state, setState }) {
  const [search, setSearch] = useState('');
  const available = useMemo(() => allPlayers.filter((p) => !state.squad.includes(p.id) && (!search || p.name.toLowerCase().includes(search.toLowerCase()))).sort((a, b) => b.ovr - a.ovr).slice(0, 50), [search, state.squad]);
  const buyPlayer = (p) => {
    const price = p.marketValue * 1000000;
    if (price > state.club.budget) return window.alert('Budget kurang!');
    if (!window.confirm(`Beli ${p.name} seharga €${fmtMoney(price)}?`)) return;
    setState((prev) => ({ ...prev, club: { ...prev.club, budget: prev.club.budget - price }, squad: [...prev.squad, p.id] }));
  };
  return (
    <div className="space-y-3">
      <div className="panel p-3">
        <div className="text-sm text-gray-400 mb-2">Budget: <span className="text-green-400 font-bold">€{fmtMoney(state.club.budget)}</span></div>
        <input placeholder="🔍 Cari pemain..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded" />
      </div>
      {available.map((p) => (
        <div key={p.id} className="panel p-3 flex justify-between items-center">
          <div><div className="font-bold text-sm">{p.name}</div><div className="text-xs text-gray-400">{p.position} · {getClubById(p.clubId)?.name || p.country}</div></div>
          <div className="text-right mr-3"><div className="text-lg font-bold gold-text">{p.ovr}</div><div className="text-xs text-gray-500">€{fmtMoney(p.marketValue * 1000000)}</div></div>
          <button onClick={() => buyPlayer(p)} disabled={p.marketValue * 1000000 > state.club.budget} className="text-xs bg-green-600 px-2 py-1 rounded disabled:bg-zinc-700">BELI</button>
        </div>
      ))}
    </div>
  );
}

function Training({ state, setState }) {
  return (
    <div className="space-y-3">
      <div className="panel p-4 flex justify-between items-center">
        <div><div className="font-bold text-gold">🏗️ Fasilitas</div><div className="text-xs text-gray-400">Level {state.club.facilities} / 5</div></div>
        <button onClick={() => { if(state.club.facilities >= 5) return; const c = 500000 * state.club.facilities; if(c > state.club.budget) return window.alert('Budget kurang!'); setState({ ...state, club: { ...state.club, facilities: state.club.facilities + 1, budget: state.club.budget - c } }); }} className="bg-yellow-500 text-black px-3 py-1 rounded text-sm font-bold">Upgrade</button>
      </div>
      <div className="panel p-4 flex justify-between items-center">
        <div><div className="font-bold text-gold">🎓 Akademi</div><div className="text-xs text-gray-400">Level {state.club.academy} / 5</div></div>
        <button onClick={() => { if(state.club.academy >= 5) return; const c = 400000 * state.club.academy; if(c > state.club.budget) return window.alert('Budget kurang!'); setState({ ...state, club: { ...state.club, academy: state.club.academy + 1, budget: state.club.budget - c } }); }} className="bg-yellow-500 text-black px-3 py-1 rounded text-sm font-bold">Upgrade</button>
      </div>
    </div>
  );
}

function DatabaseView() {
  const [query, setQuery] = useState('');
  const results = useMemo(() => allPlayers.filter((p) => !query || p.name.toLowerCase().includes(query.toLowerCase())).sort((a, b) => b.ovr - a.ovr).slice(0, 60), [query]);
  return (
    <div className="space-y-3">
      <div className="panel p-3">
        <input placeholder="🔍 Cari nama pemain asli..." value={query} onChange={(e) => setQuery(e.target.value)} className="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded" />
      </div>
      {results.map((p) => (
        <div key={p.id} className="panel p-2 flex justify-between items-center text-sm">
          <div><div className="font-bold">{p.name}</div><div className="text-xs text-gray-400">{p.position} · {getClubById(p.clubId)?.name || p.country}</div></div>
          <div className="text-right"><div className="gold-text font-bold">{p.ovr}</div><div className="text-xs text-gray-500">€{fmtMoney(p.marketValue * 1000000)}</div></div>
        </div>
      ))}
    </div>
  );
}

function CareerView({ state }) {
  const currentStage = getCareerStage(state.manager.reputation);
  return (
    <div className="space-y-3">
      <div className="panel p-4">
        <div className="text-sm text-gray-400">Jabatan Saat Ini</div>
        <div className="text-2xl font-bold gold-text">{currentStage.name}</div>
        <div className="text-sm text-green-400 mt-2">Reputasi: {state.manager.reputation} / 100</div>
      </div>
      <div className="panel p-4">
        {CAREER_STAGES.map((s, i) => (
          <div key={s.id} className={`flex items-center gap-2 py-1 ${state.manager.reputation >= s.minRep ? 'text-green-400' : 'text-gray-500'}`}>
            <span>{state.manager.reputation >= s.minRep ? '✅' : '⬜'}</span>
            <span className="text-sm">{s.name}</span>
            <span className="text-xs ml-auto">Rep {s.minRep}+</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function MatchOverlay({ log, playing, state, onClose }) {
  return (
    <div className="max-w-3xl mx-auto mt-6">
      <div className="panel p-3 min-h-[300px] max-h-[60vh] overflow-y-auto space-y-1">
        {log.map((ev, i) => (
          <div key={i} className={`text-sm p-2 rounded ${ev.type === 'goal' ? 'bg-green-900/50 text-green-300 font-bold' : ev.type === 'goal-opp' ? 'bg-red-900/50 text-red-300 font-bold' : ev.type === 'final' ? 'bg-yellow-900/40 text-yellow-300 font-bold text-center' : 'text-gray-300'}`}>
            {ev.minute > 0 && <span className="text-gray-500 font-mono mr-2">[{ev.minute}']</span>}{ev.text}
          </div>
        ))}
      </div>
      {!playing && log.length > 0 && <button onClick={onClose} className="w-full mt-3 py-3 bg-yellow-500 text-black font-bold rounded">KEMBALI KE DASHBOARD</button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
